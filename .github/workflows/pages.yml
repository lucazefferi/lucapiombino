# Pubblica il sito su GitHub Pages a ogni push su main.
#
# Il passo `configure-pages` usa `enablement: true`: abilita Pages via API
# se non lo e' gia'. Serve perche' Pages non era attivo sul repository e
# non era possibile attivarlo dall'interfaccia in quel momento.
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Il token del workflow deve poter scrivere su Pages; id-token serve
# all'azione deploy-pages per firmare il deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta, senza annullare quello gia' in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Il sito e' un singolo index.html statico: si carica la radice
      # del repository cosi' com'e', senza build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
